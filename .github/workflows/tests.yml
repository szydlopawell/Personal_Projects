name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Volatility_Estimation
        working-directory: Volatility_Estimation
        run: pytest -v

      - name: Test Options_Pricing
        working-directory: Options_Pricing
        run: pytest -v

      - name: Test RL_Optimal_Execution
        working-directory: RL_Optimal_Execution
        run: pytest -v
